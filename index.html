<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sherwood Horror RPG</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loadingScreen">
    <img src="assets/backgrounds/loading_screen_with_logo.png" alt="Loading">
    <button id="playButton">
        <img src="assets/icons/play_button.png" alt="Play">
    </button>
</div>

<div id="homeScreen">
    <img id="leftStatue" src="assets/game_details/left_statue_of_the_main_screen.png" alt="Left Statue">
    
    <div id="gameZone">
        <img id="arch" src="assets/game_details/staircase_with_an_arch.png" alt="Arch">
        <img id="leftDivider" src="assets/game_details/left_divider.png" alt="Left Divider">
        <img id="rightDivider" src="assets/game_details/divider_right.png" alt="Right Divider">
        <img id="hero" src="assets/hero_skins/skin1_01.png" alt="Hero">
    </div>
    
    <img id="rightStatue" src="assets/game_details/right_statue_of_the_main_screen.png" alt="Right Statue">
</div>

<canvas id="game"></canvas>

<script src="js/textures.js"></script>
<script src="js/audio.js"></script>
<script src="js/talents.js"></script>
<script src="js/tavern.js"></script>
<script src="js/menu.js"></script>
<script src="js/main.js"></script>   
</body>
</html>
