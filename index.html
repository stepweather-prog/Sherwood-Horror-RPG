<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sherwood Horror RPG</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Загрузочный экран -->
<div id="loadingScreen">
    <img src="assets/backgrounds/loading_screen_with_logo.png" alt="Loading">
    <button id="playButton">
        <img src="assets/icons/play_button.png" alt="Play">
    </button>
</div>

<!-- Домашняя страница -->
<div id="homeScreen">
    <video id="videoBackground" autoplay muted loop>
        <source src="assets/animation/animation_frame_hero.webm" type="video/webm">
    </video>
    <img id="leftStatue" src="assets/game_details/left_statue_of_the_main_screen.png" alt="Left Statue">
    <img id="rightStatue" src="assets/game_details/right_statue_of_the_main_screen.png" alt="Right Statue">
    <img id="arch" src="assets/game_details/staircase_with_an_arch.png" alt="Arch">
    <img id="hero" src="assets/hero_skins/skin1_01.png" alt="Hero">
</div>

<!-- Игровой канвас -->
<canvas id="game"></canvas>

<script src="js/textures.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
<script src="js/game.js"></script>
</body>
</html>
